<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GitHub Reskin</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="card">
  <header>
    <img src="icons/icon-32.png" width="20" height="20" alt="">
    <h1>GitHub Reskin</h1>
    <label class="switch" title="Turn the theme on or off">
      <input type="checkbox" id="enabled">
      <span class="track" aria-hidden="true"></span>
      <span class="sr-only">Theme on</span>
    </label>
  </header>

  <section>
    <h2>Theme</h2>
    <div class="themes" id="themes"></div>
  </section>

  <section>
    <div class="row-title">
      <h2>Colors</h2>
      <button type="button" id="reset" class="link">Reset to theme</button>
    </div>
    <div class="colors" id="colors"></div>
  </section>

  <footer>
    <span id="status"></span>
    <a href="https://github.com/sidebandstudio/GitHub-Reskin" target="_blank" rel="noreferrer">Themes and source</a>
  </footer>
</main>
<script src="themes.js"></script>
<script src="popup.js"></script>
</body>
</html>
